<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AssetBoard（聚沙）· 法律与隐私</title>
<meta name="description" content="AssetBoard（聚沙）隐私政策与使用条款。Privacy Policy and Terms of Use for AssetBoard.">
<style>
  :root{ --bg:#ffffff; --fg:#1c1c1e; --muted:#6b7280; --line:#e5e7eb; --accent:#c8102e; --card:#f7f7f8; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#111112; --fg:#f2f2f4; --muted:#9ca3af; --line:#2c2c2e; --accent:#ff4d6a; --card:#1a1a1c; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:32px 22px;
    font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  .box{max-width:560px;width:100%}
  h1{font-size:30px;margin:0 0 6px;letter-spacing:-.3px}
  .sub{color:var(--muted);font-size:15px;margin:0 0 34px}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:14px}
  a.card{display:block;padding:20px 22px;border:1px solid var(--line);border-radius:14px;
    background:var(--card);color:var(--fg);text-decoration:none;transition:.16s}
  a.card:hover{border-color:var(--accent);transform:translateY(-1px)}
  a.card b{display:block;font-size:17px;margin-bottom:3px;font-weight:600}
  a.card span{color:var(--muted);font-size:14px}
  footer{margin-top:36px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="box">
  <h1>AssetBoard</h1>
  <p class="sub">全球资产・多币种组合追踪</p>
  <ul>
    <li><a class="card" href="./privacy/"><b>隐私政策</b><span>Privacy Policy · 简体中文 / 繁體中文 / English</span></a></li>
    <li><a class="card" href="./eula/"><b>使用条款</b><span>Terms of Use · 简体中文 / 繁體中文 / English</span></a></li>
  </ul>
  <footer>© 2026 AssetBoard. All rights reserved.</footer>
</div>
</body>
</html>
